<style>
html,body{margin:0;height:100%;background:#05080a;overflow:hidden;font-family:'Barlow Condensed',system-ui,sans-serif;color:#e6eee8}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(90,0,0,.38) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;background-size:256px 256px}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:24px;background:#05080a}
</style>
<link rel="stylesheet" href="src/questions/ui.css">
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="err">Bu tarayıcı 3D’yi desteklemiyor.</div>
</div>
